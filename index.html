const {useState,useEffect,useCallback,useMemo,useRef}=React;
const MURID=window.MURID_DATA;
const ACARA=window.ACARA_DATA;

// ── Firebase hook — realtime sync to sukanprapp/data/<path> ──
function useFirebase(path, init) {
  const [val, setVal] = useState(init);
  const [ready, setReady] = useState(false);
  const valRef = useRef(init);

  useEffect(() => {
    const ref = window.fbDB.ref(`sukanprapp/data/${path}`);
    const handler = snap => {
      const raw = snap.val();
      // Firebase converts dense arrays to objects — restore them
      function revive(d) {
        if (d === null || d === undefined) return d;
        if (typeof d !== 'object') return d;
        const keys = Object.keys(d);
        if (keys.length > 0 && keys.every(k => !isNaN(Number(k)))) {
          return keys.sort((a,b)=>Number(a)-Number(b)).map(k => revive(d[k]));
        }
        const out = {};
        for (const k of keys) out[k] = revive(d[k]);
        return out;
      }
      const data = raw !== null ? revive(raw) : init;
      valRef.current = data;
      setVal(data);
      setReady(true);
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [path]);

  const set = useCallback(nv => {
    const next = typeof nv === 'function' ? nv(valRef.current) : nv;
    valRef.current = next;
    setVal(next);
    window.fbDB.ref(`sukanprapp/data/${path}`).set(next);
  }, [path]);

  return [val, set, ready];
}

// ── Constants ──
const KC={'Az Zahra':'#7C3AED','Nur Iman':'#059669'};
const KB={'Az Zahra':'#EDE9FE','Nur Iman':'#D1FAE5'};
const MC=['#D97706','#6B7280','#92400E'];
const ME=['🥇','🥈','🥉'];
const ML=['Emas','Perak','Gangsa'];

function getMedalTally(keputusan){
  const t={'Az Zahra':{e:0,p:0,g:0},'Nur Iman':{e:0,p:0,g:0}};
  Object.entries(keputusan).forEach(([eid,res])=>{
    const a=ACARA.find(x=>x.id===eid);if(!a)return;
    ['p1','p2','p3'].forEach((pos,i)=>{
      const r=res[pos];if(!r?.winner)return;
      let k=null;
      if(a.jenis==='relay'){k=r.winner.startsWith('Az Zahra')?'Az Zahra':'Nur Iman';}
      else{const m=MURID.find(m=>m.id===r.winner);k=m?m.k:null;}
      if(!k||!t[k])return;
      if(i===0)t[k].e++;else if(i===1)t[k].p++;else t[k].g++;
    });
  });
  return t;
}
function eligibleMurid(a){return MURID.filter(m=>m.u===a.u&&m.j===a.j)}
function relayTeams(a){return a.u===6?['Az Zahra','Nur Iman']:['Az Zahra A','Az Zahra B']}

// ── UI Primitives ──
function Badge({children,color='#374151',bg='#F3F4F6',sm}){
  return<span style={{display:'inline-block',padding:sm?'1px 7px':'2px 10px',borderRadius:20,fontSize:sm?10:11,fontWeight:700,color,background:bg,lineHeight:1.6}}>{children}</span>
}
function Card({children,style}){
  return<div style={{background:'#fff',borderRadius:16,padding:'14px 16px',boxShadow:'0 2px 12px rgba(0,0,0,0.07)',...style}}>{children}</div>
}

        <div style={{fontSize:11,fontWeight:700,letterSpacing:2.5,opacity:.75,marginBottom:8}}>SK SRI AMAN</div>
        <div style={{fontSize:24,fontWeight:900,lineHeight:1.1,marginBottom:4}}>Kejohanan Pra Sekolah</div>
        <div style={{fontSize:15,opacity:.85,marginBottom:20}}>Sesi Tahun 2026</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <div style={{background:'rgba(255,255,255,0.18)',backdropFilter:'blur(4px)',borderRadius:12,padding:'6px 14px',fontSize:13,fontWeight:700}}>{done}/12 acara selesai</div>
          <div style={{background:'rgba(255,255,255,0.18)',backdropFilter:'blur(4px)',borderRadius:12,padding:'6px 14px',fontSize:13,fontWeight:700}}>46 murid · 2 kelas</div>
        </div>
      </div>

      <div style={{padding:'0 16px',marginTop:-28}}>


        {/* Quick actions */}
        <div style={{fontWeight:800,fontSize:14,color:'#374151',marginBottom:10,letterSpacing:.5}}>TINDAKAN PANTAS</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:20}}>
          {[
            {icon:'📋',label:'Daftar Peserta',sub:'Pilih murid per acara',color:'#1D4ED8',bg:'linear-gradient(135deg,#EFF6FF,#DBEAFE)',tab:'acara'},
            {icon:'✏️',label:'Rekod Keputusan',sub:'Catat keputusan',color:'#B45309',bg:'linear-gradient(135deg,#FFFBEB,#FEF3C7)',tab:'acara'},
            {icon:'🏅',label:'Lihat Keputusan',sub:'Jadual pingat & hasil',color:'#DC2626',bg:'linear-gradient(135deg,#FEF2F2,#FEE2E2)',tab:'keputusan'},
            {icon:'📖',label:'Senarai Murid',sub:'46 murid, 2 kelas',color:'#065F46',bg:'linear-gradient(135deg,#ECFDF5,#D1FAE5)',tab:'murid'},
          ].map(a=>(
            <button key={a.label} onClick={()=>setTab(a.tab)}
              style={{background:a.bg,border:'none',borderRadius:16,padding:'16px 14px',cursor:'pointer',textAlign:'left',boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}>
              <div style={{fontSize:28,marginBottom:8}}>{a.icon}</div>
              <div style={{fontWeight:800,fontSize:13,color:a.color,marginBottom:2}}>{a.label}</div>
              <div style={{fontSize:11,color:'#6B7280',fontWeight:600}}>{a.sub}</div>
            </button>
          ))}
        </div>

        {/* Progress */}
        <Card>
          <div style={{fontWeight:800,fontSize:14,marginBottom:12}}>📊 Status Acara</div>
          {gLabel.map((g,gi)=>{
            const ids=groups[gi];
            const d=ids.filter(id=>keputusan[id]?.p1?.winner).length;
            const pct=d/ids.length*100;
            return(
              <div key={g} style={{marginBottom:gi<2?12:0}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:700,marginBottom:5}}>
                  <span style={{color:'#374151'}}>{g}</span>
                  <span style={{color:d===ids.length?'#059669':'#9CA3AF'}}>{d}/{ids.length} {d===ids.length?'✅':''}</span>
                </div>
                <div style={{height:8,background:'#F3F4F6',borderRadius:99,overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${pct}%`,background:'linear-gradient(90deg,#5B21B6,#1D4ED8)',borderRadius:99,transition:'width .5s ease'}}/>
                </div>
              </div>
            );
          })}
        </Card>
      </div>
    </div>
  );
}

    {label:'5 Tahun – Larian',ids:['e01','e02'],icon:'🏃'},
    {label:'6 Tahun – Larian',ids:['e03','e04'],icon:'🏃'},

    {label:'6 Tahun – Lontar Peluru',ids:['e07','e08'],icon:'⚾'},
    {label:'5 Tahun – Relay 4×50m',ids:['e09','e10'],icon:'🔄'},

  ];
  return(
    <div style={{padding:'20px 16px 90px'}}>
      <div style={{fontWeight:900,fontSize:22,marginBottom:4}}>Senarai Acara</div>
      <div style={{fontSize:13,color:'#6B7280',fontWeight:600,marginBottom:20}}>12 acara · Pilih untuk daftar atau rekod</div>
      {groups.map(g=>(
        <div key={g.label} style={{marginBottom:20}}>
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
            <span style={{fontSize:14}}>{g.icon}</span>
            <span style={{fontWeight:800,fontSize:11,letterSpacing:1.2,color:'#6B7280'}}>{g.label.toUpperCase()}</span>
          </div>
          {g.ids.map(id=>{
            const a=ACARA.find(x=>x.id===id);
            const hasResult=!!keputusan[id]?.p1?.winner;
            const regCount=(daftar[id]||[]).length;
            const isL=a.j==='L';
            return(
              <button key={id} onClick={()=>onSelect(id)}
                style={{width:'100%',background:'#fff',border:'none',borderRadius:14,padding:'14px 16px',marginBottom:8,cursor:'pointer',display:'flex',alignItems:'center',gap:12,boxShadow:'0 2px 10px rgba(0,0,0,0.06)',textAlign:'left'}}>
                <div style={{width:42,height:42,borderRadius:12,background:isL?'#EFF6FF':'#FDF2F8',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>
                  {isL?'♂':'♀'}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:800,fontSize:14,color:'#111',marginBottom:4}}>{a.nama}</div>
                  <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                    <Badge color={isL?'#1D4ED8':'#BE185D'} bg={isL?'#EFF6FF':'#FDF2F8'}>{isL?'Lelaki':'Perempuan'}</Badge>
                    <Badge color='#374151' bg='#F3F4F6'>{a.u} Tahun</Badge>
                    {regCount>0&&<Badge color='#065F46' bg='#ECFDF5'>{regCount} didaftar</Badge>}
                  </div>
                </div>
                <div style={{flexShrink:0,fontSize:hasResult?22:18,color:hasResult?'#059669':'#D1D5DB'}}>{hasResult?'✅':'›'}</div>
              </button>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ── ACARA DETAIL ──
function AcaraDetail({id,onBack,daftar,setDaftar,keputusan,setKeputusan}){
  const[subTab,setSubTab]=useState('daftar');
  const a=ACARA.find(x=>x.id===id);
  const eligible=useMemo(()=>eligibleMurid(a),[id]);
  const teams=useMemo(()=>relayTeams(a),[id]);
  const selected=daftar[id]||[];
  const res=keputusan[id]||{};
  const isL=a.j==='L';

  function toggleStudent(sid){
    const cur=daftar[id]||[];
    setDaftar({...daftar,[id]:cur.includes(sid)?cur.filter(x=>x!==sid):[...cur,sid]});
  }
  function setResult(pos,field,val){
    const cur=keputusan[id]||{};
    setKeputusan({...keputusan,[id]:{...cur,[pos]:{...(cur[pos]||{}),[field]:val}}});
  }

  return(
    <div style={{minHeight:'100vh',background:'#FFFBF0'}}>
      {/* Header */}
      <div style={{background:'linear-gradient(135deg,#5B21B6,#1D4ED8)',color:'#fff',padding:'20px 16px 24px'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
          <button onClick={onBack} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'#fff',borderRadius:10,width:36,height:36,cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>←</button>
          <div style={{flex:1}}>
            <div style={{fontSize:11,opacity:.7,fontWeight:700,letterSpacing:1}}>ACARA {String(a.bil).padStart(2,'0')}</div>
            <div style={{fontWeight:900,fontSize:17}}>{a.nama}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <Badge color='#fff' bg='rgba(255,255,255,0.22)'>{a.u} Tahun</Badge>
          <Badge color='#fff' bg='rgba(255,255,255,0.22)'>{isL?'Lelaki':'Perempuan'}</Badge>
          <Badge color='#fff' bg='rgba(255,255,255,0.22)'>{a.jenis==='relay'?'Relay':'Individu'}</Badge>
          <Badge color='#fff' bg='rgba(255,255,255,0.22)'>Ukur: {a.unit}</Badge>
        </div>
      </div>

      {/* Sub-tabs */}
      <div style={{display:'flex',background:'#fff',boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}>
        {[['daftar','📋 Pendaftaran'],['rekod','✏️ Rekod Keputusan']].map(([t,l])=>(
          <button key={t} onClick={()=>setSubTab(t)}
            style={{flex:1,padding:'13px 8px',border:'none',background:'none',fontWeight:700,fontSize:13,cursor:'pointer',color:subTab===t?'#5B21B6':'#9CA3AF',borderBottom:`3px solid ${subTab===t?'#5B21B6':'transparent'}`,transition:'all .2s'}}>
            {l}
          </button>
        ))}
      </div>

      <div style={{padding:'16px 16px 90px'}}>
        {/* ── PENDAFTARAN ── */}
        {subTab==='daftar'&&(
          a.jenis==='individu'?(
            <div>
              <div style={{background:'#EDE9FE',borderRadius:12,padding:'10px 14px',marginBottom:14,fontSize:13,fontWeight:700,color:'#5B21B6'}}>
                {selected.length} murid dipilih daripada {eligible.length} layak
              </div>
              {eligible.length===0&&<div style={{textAlign:'center',color:'#9CA3AF',padding:32}}>Tiada murid layak untuk acara ini.</div>}
              {eligible.map(m=>{
                const checked=selected.includes(m.id);
                return(
                  <button key={m.id} onClick={()=>toggleStudent(m.id)}
                    style={{width:'100%',display:'flex',alignItems:'center',gap:12,background:checked?KB[m.k]:'#fff',border:`2px solid ${checked?KC[m.k]:'#E5E7EB'}`,borderRadius:13,padding:'12px 14px',marginBottom:8,cursor:'pointer',textAlign:'left',transition:'all .15s'}}>
                    <div style={{width:24,height:24,borderRadius:7,background:checked?KC[m.k]:'#F3F4F6',border:`2px solid ${checked?KC[m.k]:'#D1D5DB'}`,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:14,flexShrink:0,fontWeight:900}}>
                      {checked?'✓':''}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:13,color:'#111'}}>{m.nama}</div>
                      <div style={{fontSize:11,color:KC[m.k],fontWeight:700,marginTop:2}}>{m.k}</div>
                    </div>
                  </button>
                );
              })}
            </div>
          ):(
            // Relay
            <div>
              <div style={{background:'#EDE9FE',borderRadius:12,padding:'10px 14px',marginBottom:14,fontSize:13,fontWeight:700,color:'#5B21B6'}}>
                Pilih 4 pelari untuk setiap pasukan
              </div>
              {teams.map(team=>{
                const teamKey=`${id}_${team}`;
                const tSel=daftar[teamKey]||[];
                const tEligible=eligible.filter(m=>{
                  if(a.u===6)return m.k===(team==='Nur Iman'?'Nur Iman':'Az Zahra');
                  return m.k==='Az Zahra';
                });
                const tColor=KC[team.startsWith('Nur')?'Nur Iman':'Az Zahra'];
                const tBg=KB[team.startsWith('Nur')?'Nur Iman':'Az Zahra'];
                return(
                  <div key={team} style={{marginBottom:20}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                      <div style={{width:10,height:10,borderRadius:'50%',background:tColor}}/>
                      <div style={{fontWeight:800,fontSize:14,color:tColor}}>Pasukan {team}</div>
                      <Badge color={tSel.length===4?'#fff':'#374151'} bg={tSel.length===4?tColor:'#F3F4F6'}>{tSel.length}/4 pelari</Badge>
                    </div>
                    {tEligible.map(m=>{
                      const checked=tSel.includes(m.id);
                      const disabled=!checked&&tSel.length>=4;
                      return(
                        <button key={m.id} disabled={disabled} onClick={()=>{
                          const cur=daftar[teamKey]||[];
                          setDaftar({...daftar,[teamKey]:cur.includes(m.id)?cur.filter(x=>x!==m.id):[...cur,m.id]});
                        }} style={{width:'100%',display:'flex',alignItems:'center',gap:12,background:checked?tBg:'#fff',border:`2px solid ${checked?tColor:'#E5E7EB'}`,borderRadius:12,padding:'10px 14px',marginBottom:6,cursor:disabled?'not-allowed':'pointer',opacity:disabled?.4:1,textAlign:'left'}}>
                          <div style={{width:22,height:22,borderRadius:6,background:checked?tColor:'#F3F4F6',border:`2px solid ${checked?tColor:'#D1D5DB'}`,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:13,flexShrink:0,fontWeight:900}}>
                            {checked?'✓':''}
                          </div>
                          <div style={{fontWeight:700,fontSize:13}}>{m.nama}</div>
                        </button>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          )
        )}

        {/* ── REKOD KEPUTUSAN ── */}
        {subTab==='rekod'&&(
          <div>
            {selected.length===0&&a.jenis==='individu'&&(
              <div style={{background:'#FEF3C7',borderRadius:12,padding:'10px 14px',marginBottom:14,fontSize:13,fontWeight:700,color:'#92400E'}}>
                ⚠️ Belum ada peserta didaftar. Anda masih boleh rekod keputusan.
              </div>
            )}
            {['p1','p2','p3'].map((pos,i)=>{
              const cur=res[pos]||{};
              const winners=a.jenis==='relay'
                ?teams
                :selected.length>0?selected.map(sid=>({id:sid,nama:MURID.find(m=>m.id===sid)?.nama})):eligible.map(m=>({id:m.id,nama:m.nama}));
              return(
                <Card key={pos} style={{marginBottom:12,borderLeft:`4px solid ${MC[i]}`}}>
                  <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
                    <span style={{fontSize:28}}>{ME[i]}</span>
                    <div>
                      <div style={{fontWeight:900,fontSize:16,color:MC[i]}}>{ML[i]}</div>
                      <div style={{fontSize:11,color:'#9CA3AF',fontWeight:600}}>Tempat Ke-{i+1}</div>
                    </div>
                  </div>
                  <div style={{marginBottom:10}}>
                    <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>{a.jenis==='relay'?'Pasukan Menang':'Peserta'}</label>
                    <select value={cur.winner||''} onChange={e=>setResult(pos,'winner',e.target.value)}
                      style={{width:'100%',padding:'11px 12px',borderRadius:10,border:'2px solid #E5E7EB',fontSize:13,fontWeight:600,background:'#FAFAFA',appearance:'none',outline:'none'}}>
                      <option value=''>-- Pilih --</option>
                      {a.jenis==='relay'
                        ?teams.map(t=><option key={t} value={t}>{t}</option>)
                        :winners.map(w=><option key={w.id||w} value={w.id||w}>{w.nama||w}</option>)
                      }
                    </select>
                  </div>
                  <div>
                    <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>
                      {a.unit==='saat'?'⏱ Masa (saat)':'📏 Jarak (meter)'}
                    </label>
                    <input type='number' step='0.01' min='0'
                      placeholder={a.unit==='saat'?'cth: 10.52':'cth: 3.25'}
                      value={cur.nilai||''}
                      onChange={e=>setResult(pos,'nilai',e.target.value)}
                      style={{width:'100%',padding:'11px 12px',borderRadius:10,border:'2px solid #E5E7EB',fontSize:13,fontWeight:600,background:'#FAFAFA',outline:'none'}}/>
                  </div>
                </Card>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ── KEPUTUSAN ──
function KeputusanScreen({keputusan}){
  const tally=useMemo(()=>getMedalTally(keputusan),[keputusan]);
  const results=ACARA.filter(a=>keputusan[a.id]?.p1?.winner);

  return(
    <div style={{padding:'20px 16px 90px'}}>
      <div style={{fontWeight:900,fontSize:22,marginBottom:4}}>Keputusan</div>
      <div style={{fontSize:13,color:'#6B7280',fontWeight:600,marginBottom:16}}>{results.length} acara telah direkodkan</div>

      {/* Medal table */}
      <Card style={{marginBottom:20}}>
        <div style={{fontWeight:900,fontSize:15,marginBottom:14}}>🏆 Jadual Pingat Akhir</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr repeat(4,44px)',gap:0,fontSize:12,fontWeight:700,color:'#6B7280',marginBottom:8}}>
          <span>Kelas</span>
          {ME.map((e,i)=><span key={i} style={{textAlign:'center',color:MC[i]}}>{e}</span>)}
          <span style={{textAlign:'center'}}>Jml</span>
        </div>
        {['Az Zahra','Nur Iman'].map(k=>{
          const t=tally[k];const total=t.e+t.p+t.g;
          return(
            <div key={k} style={{display:'grid',gridTemplateColumns:'1fr repeat(4,44px)',gap:0,padding:'12px 0',borderTop:'1px solid #F3F4F6',alignItems:'center'}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <div style={{width:12,height:12,borderRadius:'50%',background:KC[k],flexShrink:0}}/>
                <span style={{fontWeight:700,fontSize:14}}>{k}</span>
              </div>
              {[t.e,t.p,t.g].map((v,i)=><div key={i} style={{textAlign:'center',fontWeight:900,fontSize:18,color:v>0?MC[i]:'#D1D5DB'}}>{v}</div>)}
              <div style={{textAlign:'center',fontWeight:900,fontSize:20,color:'#111'}}>{total}</div>
            </div>
          );
        })}
      </Card>

      {/* Results */}
      <div style={{fontWeight:800,fontSize:14,marginBottom:10}}>Keputusan Acara</div>
      {results.length===0&&(
        <div style={{textAlign:'center',padding:'48px 0',color:'#9CA3AF'}}>
          <div style={{fontSize:40,marginBottom:8}}>📋</div>
          <div style={{fontWeight:700}}>Belum ada keputusan direkod</div>
        </div>
      )}
      {results.map(a=>{
        const res=keputusan[a.id]||{};
        const isL=a.j==='L';
        return(
          <Card key={a.id} style={{marginBottom:12}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
              <div style={{fontWeight:800,fontSize:14}}>{a.nama}</div>
              <Badge color={isL?'#1D4ED8':'#BE185D'} bg={isL?'#EFF6FF':'#FDF2F8'} sm>{isL?'L':'P'}</Badge>
              <Badge color='#374151' bg='#F3F4F6' sm>{a.u}T</Badge>
              {a.jenis==='relay'&&<Badge color='#5B21B6' bg='#EDE9FE' sm>Relay</Badge>}
            </div>
            {['p1','p2','p3'].map((pos,i)=>{
              const r=res[pos];if(!r?.winner)return null;
              const label=a.jenis==='relay'?r.winner:(MURID.find(m=>m.id===r.winner)?.nama||r.winner);
              const kelas=a.jenis==='relay'?(r.winner.startsWith('Az')?'Az Zahra':'Nur Iman'):(MURID.find(m=>m.id===r.winner)?.k);
              return(
                <div key={pos} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 0',borderTop:'1px solid #F9FAFB'}}>
                  <span style={{fontSize:20,flexShrink:0}}>{ME[i]}</span>
                  <div style={{flex:1,fontSize:13,fontWeight:700,color:'#111'}}>{label}</div>
                  {kelas&&<Badge color={KC[kelas]||'#374151'} bg={KB[kelas]||'#F3F4F6'} sm>{kelas}</Badge>}
                  {r.nilai&&<span style={{fontSize:12,color:'#6B7280',fontWeight:700,flexShrink:0}}>{r.nilai} {a.unit}</span>}
                </div>
              );
            })}
          </Card>
        );
      })}
    </div>
  );
}

// ── MURID ──
function MuridScreen({daftar}){
  const[open,setOpen]=useState('Az Zahra');
  function getRegs(mid){
    return ACARA.filter(a=>(daftar[a.id]||[]).includes(mid));
  }
  return(
    <div style={{padding:'20px 16px 90px'}}>
      <div style={{fontWeight:900,fontSize:22,marginBottom:4}}>Senarai Murid</div>
      <div style={{fontSize:13,color:'#6B7280',fontWeight:600,marginBottom:16}}>46 murid · 2 kelas prasekolah</div>
      {['Az Zahra','Nur Iman'].map(k=>{
        const murid=MURID.filter(m=>m.k===k);
        const isOpen=open===k;
        return(
          <div key={k} style={{marginBottom:12}}>
            <button onClick={()=>setOpen(isOpen?null:k)}
              style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',background:isOpen?KC[k]:KB[k],border:`2px solid ${KC[k]}`,borderRadius:isOpen?'14px 14px 0 0':14,padding:'14px 18px',cursor:'pointer',color:isOpen?'#fff':KC[k],transition:'all .2s'}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontSize:22}}>🏫</span>
                <div style={{textAlign:'left'}}>
                  <div style={{fontWeight:800,fontSize:15}}>{k}</div>
                  <div style={{fontSize:11,opacity:.8,fontWeight:600}}>{murid.filter(m=>m.u===5).length} murid 5T · {murid.filter(m=>m.u===6).length} murid 6T</div>
                </div>
              </div>
              <span style={{fontSize:14,fontWeight:700}}>{isOpen?'▲':'▼'}</span>
            </button>
            {isOpen&&(
              <div style={{background:'#fff',border:`2px solid ${KC[k]}`,borderTop:'none',borderRadius:'0 0 14px 14px',overflow:'hidden'}}>
                {[5,6].map(umur=>{
                  const sub=murid.filter(m=>m.u===umur);
                  if(!sub.length)return null;
                  return(
                    <div key={umur}>
                      <div style={{padding:'8px 16px',background:'#FAFAFA',fontWeight:800,fontSize:10,color:'#6B7280',letterSpacing:1.5}}>{umur} TAHUN ({sub.filter(m=>m.j==='L').length}L · {sub.filter(m=>m.j==='P').length}P)</div>
                      {sub.map(m=>{
                        const regs=getRegs(m.id);
                        return(
                          <div key={m.id} style={{padding:'10px 16px',borderTop:'1px solid #F3F4F6',display:'flex',gap:10,alignItems:'flex-start'}}>
                            <div style={{width:30,height:30,borderRadius:9,background:m.j==='L'?'#EFF6FF':'#FDF2F8',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0,border:`1.5px solid ${m.j==='L'?'#BFDBFE':'#FBCFE8'}`}}>
                              {m.j==='L'?'♂':'♀'}
                            </div>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontWeight:700,fontSize:13,color:'#111'}}>{m.nama}</div>
                              {regs.length>0&&(
                                <div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:4}}>
                                  {regs.map(a=><Badge key={a.id} color='#5B21B6' bg='#EDE9FE' sm>{a.nama.replace('Larian ','').replace('Lontar Peluru','Lontar')}</Badge>)}
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── BOTTOM NAV ──
function BottomNav({tab,setTab}){
  const items=[
    {id:'home',icon:'🏠',label:'Utama'},
    {id:'acara',icon:'🏃',label:'Acara'},
    {id:'keputusan',icon:'🏆',label:'Keputusan'},
    {id:'murid',icon:'📖',label:'Murid'},
  ];
  return(
    <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:430,background:'#fff',borderTop:'1px solid #E5E7EB',display:'flex',zIndex:100,boxShadow:'0 -4px 24px rgba(0,0,0,0.09)'}}>
      {items.map(it=>(
        <button key={it.id} onClick={()=>setTab(it.id)}
          style={{flex:1,padding:'10px 4px 12px',border:'none',background:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,position:'relative'}}>
          <span style={{fontSize:22,lineHeight:1}}>{it.icon}</span>
          <span style={{fontSize:10,fontWeight:700,color:tab===it.id?'#5B21B6':'#9CA3AF',transition:'color .2s'}}>{it.label}</span>
          {tab===it.id&&<div style={{position:'absolute',top:0,left:'50%',transform:'translateX(-50%)',width:28,height:3,borderRadius:99,background:'#5B21B6'}}/>}
        </button>
      ))}
    </div>
  );
}

// ── TWEAKS ──
const TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{
  "primaryGrad": "#ed0735",
  "accentGrad": "#d71db5",
  "azColor": "#7C3AED",
  "niColor": "#059669"
}/*EDITMODE-END*/;

function TweaksPanel({visible}){
  const[tw,setTw]=useState(TWEAK_DEFAULTS);
  if(!visible)return null;
  return(
    <div style={{position:'fixed',bottom:72,right:12,background:'#fff',borderRadius:16,padding:16,boxShadow:'0 8px 32px rgba(0,0,0,0.18)',zIndex:300,width:210}}>
      <div style={{fontWeight:900,fontSize:14,marginBottom:12,color:'#111'}}>⚙️ Tweaks</div>
      {[
        {key:'primaryGrad',label:'Warna Utama'},
        {key:'accentGrad',label:'Warna Aksen'},
        {key:'azColor',label:'Az Zahra'},
        {key:'niColor',label:'Nur Iman'},
      ].map(({key,label})=>(
        <div key={key} style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <span style={{fontSize:12,fontWeight:700,color:'#374151'}}>{label}</span>
          <input type='color' value={tw[key]} onChange={e=>{
            const next={...tw,[key]:e.target.value};
            setTw(next);
            window.parent.postMessage({type:'__edit_mode_set_keys',edits:next},'*');
          }} style={{width:34,height:28,border:'none',borderRadius:6,cursor:'pointer',padding:1}}/>
        </div>
      ))}
      <button onClick={()=>{
        if(confirm('Reset semua data kejohanan di Firebase?')){
          window.fbDB.ref('sukanprapp/data').remove().then(()=>window.location.reload());
        }
      }} style={{width:'100%',marginTop:8,padding:'8px',border:'2px solid #FEE2E2',borderRadius:8,background:'#FEF2F2',color:'#DC2626',fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>
        🗑 Reset Data
      </button>
    </div>
  );
}

// ── APP ROOT ──
function App(){
  const[tab,setTab]=useState('home');
  const[acaraId,setAcaraId]=useState(null);
  const[daftar,setDaftar,daftarReady]=useFirebase('daftar',{});
  const[keputusan,setKeputusan,keputusanReady]=useFirebase('keputusan',{});
  const[tweaksVisible,setTweaksVisible]=useState(false);
  const[connected,setConnected]=useState(window.fbConnected||false);

  const ready = daftarReady && keputusanReady;

  useEffect(()=>{
    const handler=e=>{
      if(e.data?.type==='__activate_edit_mode')setTweaksVisible(true);
      if(e.data?.type==='__deactivate_edit_mode')setTweaksVisible(false);
    };
    window.addEventListener('message',handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');

    const fbHandler = e => setConnected(e.detail);
    document.addEventListener('fb-connection', fbHandler);

    return()=>{
      window.removeEventListener('message',handler);
      document.removeEventListener('fb-connection', fbHandler);
    };
  },[]);

  const shell={maxWidth:430,margin:'0 auto',minHeight:'100vh',background:'#FFFBF0',fontFamily:"'Nunito',sans-serif",position:'relative',overflow:'hidden'};

  // Loading screen
  if(!ready) return(
    <div style={{...shell,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}}>
      <div style={{fontSize:48}}>🏅</div>
      <div style={{fontWeight:900,fontSize:18,color:'#5B21B6'}}>Kejohanan Pra Sekolah</div>
      <div style={{fontWeight:700,fontSize:13,color:'#9CA3AF'}}>SK Sri Aman 2026</div>
      <div style={{marginTop:8,width:48,height:48,border:'4px solid #EDE9FE',borderTop:'4px solid #5B21B6',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
      <div style={{fontSize:12,color:'#9CA3AF',fontWeight:600}}>Menyambung ke Firebase…</div>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  // Connection badge (always visible top-right)
  const ConnBadge = ()=>(
    <div style={{position:'fixed',top:10,right:12,zIndex:500,display:'flex',alignItems:'center',gap:5,background:'#fff',borderRadius:20,padding:'4px 10px',boxShadow:'0 2px 8px rgba(0,0,0,0.1)',fontSize:11,fontWeight:700,color:connected?'#059669':'#DC2626'}}>
      <div style={{width:7,height:7,borderRadius:'50%',background:connected?'#059669':'#DC2626',boxShadow:connected?'0 0 0 2px #D1FAE5':'0 0 0 2px #FEE2E2'}}/>
      {connected?'Firebase ●':'Offline ●'}
    </div>
  );

  if(acaraId) return(
    <div style={shell}>
      <ConnBadge/>
      <AcaraDetail id={acaraId} onBack={()=>setAcaraId(null)}
        daftar={daftar} setDaftar={setDaftar}
        keputusan={keputusan} setKeputusan={setKeputusan}/>
      <TweaksPanel visible={tweaksVisible}/>
    </div>
  );

  return(
    <div style={shell}>
      <ConnBadge/>
      <div style={{overflowY:'auto',height:'100vh'}}>
        {tab==='home'&&<HomeScreen setTab={setTab} keputusan={keputusan}/>}
        {tab==='acara'&&<AcaraScreen onSelect={setAcaraId} daftar={daftar} keputusan={keputusan}/>}
        {tab==='keputusan'&&<KeputusanScreen keputusan={keputusan}/>}
        {tab==='murid'&&<MuridScreen daftar={daftar}/>}
      </div>
      <BottomNav tab={tab} setTab={setTab}/>
      <TweaksPanel visible={tweaksVisible}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
